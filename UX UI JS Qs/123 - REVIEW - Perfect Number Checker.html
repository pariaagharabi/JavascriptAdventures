<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Perfect Number Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(17, 16, 17);
            color: rgb(249, 3, 249);
            margin-top: 12px;
            font-family: Georgia, 'Times New Roman', Times, serif
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.5;
        }

        .innerContainer {
            text-align: center;
            border: 2px solid rgb(249, 3, 249);
            border-radius: 10px;
            box-shadow: 0 0 12px;
            padding: 20px;
            margin: 8px;
        }

        .mainContainer .inputGroup label::after {
            content: " *";
            color: red;
        }

        .mainContainer .inputGroup input {
            color: rgb(249, 3, 249);
            background-color: transparent;
            border: 1px solid rgb(249, 3, 249);
            border-radius: 4px;
            padding: 2px;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Perfect Number Checker:</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number">
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="outputContainer">
                <h2>Result:</h2>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        function isPerfectNumber(orgNum) {
            if (orgNum <= 0) {
                return "Perfect numbers are positive integers greater than zero.";
            }

            let sum = 0;
            for (let i = 1; i < orgNum; i++) {
                if (orgNum % i === 0) {
                    sum += i;
                }
            }

            return sum === orgNum ? `${orgNum} is a perfect number.` : `${orgNum} is not a perfect number.`;
        }

        // Example usage:
        console.log(isPerfectNumber(6)); // Output: 6 is a perfect number.

    </script>
</body>

</html>
