<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Sum of Digits</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(0, 6, 33);
            color: rgb(228, 228, 229);
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin-top: 12px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.6;
        }

        .innerContainer {
            border: 2px solid rgb(228, 228, 229);
            border-radius: 10px;
            box-shadow: 0 0 10px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">

            <header class="headerContainer">
                <h1>Sum of Digits</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number..." required>
                </div>
                <button id="calculateButton">Calculate Sum of Digits</button>
            </main>

            <div class="outputContainer">
                <h1>Result: <span id="result"></span></h1>
            </div>

        </div>
    </div>

    <script>
        document.getElementById("calculateButton").addEventListener("click", () => {
            const numberInput = document.getElementById("numberInput").value;

            document.getElementById("result").innerText = sumOfDigits(parseInt(numberInput));

        });

        function sumOfDigits(num) {
            let sum = 0;
            while (num > 0) {
                sum += num % 10;
                num = Math.floor(num / 10);
            }
            return sum;
        }

        // Example usage:
        console.log(sumOfDigits(12345)); // Output: 15
    </script>

</body>

</html>
