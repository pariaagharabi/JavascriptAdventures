<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Fibonacci Number Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcf4f9;
            color: #6a0242;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-top: 20px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.6;
        }

        .innerContainer {
            text-align: center;
            border: 1px solid #6a0242;
            border-radius: 12px;
            box-shadow: 0 0 12px #6a0242;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Fibonacci Number Checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number...">
                </div>
                <button id="checkButton">Check Fibonacci</button>
            </main>

            <div class="outputContainer">
                <h2>
                    <p id="output">Result: </p>
                </h2>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("checkButton").addEventListener("click", () => {
            const userInput = parseInt(document.getElementById("numberInput").value);

            if (isNaN(userInput)) {
                document.getElementById("output").textContent = "Result: Please enter a valid number.";
                return;
            }

            document.getElementById("output").textContent = `Result: ${userInput} is ${isFibonacci(userInput) ? '' : 'not '}a Fibonacci number.`;
        });

        function isFibonacci(orgNum) {
            let a = 0;
            let b = 1;
            let c = a + b;

            while (c < orgNum) {
                a = b;
                b = c;
                c = a + b;
            }

            if (c === orgNum || orgNum === 0) {
                return true;
            } else {
                return false;
            }
        }

        // Example usage:
        console.log(isFibonacci(8));  // true
        console.log(isFibonacci(10)); // false
    </script>
</body>

</html>
