<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Fibonacci Number Checker</title>
    <style>

    </style>
</head>

<body>

    <script>
        function isFibonacci(orgNum) {
            let a = 0;
            let b = 1;
            let c = a + b;

            while (c < orgNum) {
                a = b;
                b = c;
                c = a + b;
            }

            if (c === orgNum || orgNum === 0) {
                return true;
            } else {
                return false;
            }
        }

        // Example usage:
        console.log(isFibonacci(8));  // true
        console.log(isFibonacci(10)); // false
    </script>
</body>

</html>
