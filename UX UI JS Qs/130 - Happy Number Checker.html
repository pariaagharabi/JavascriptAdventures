<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Number Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
        }

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Happy Number Checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number...">
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="outputContainer">
                <h1>Result:</h1>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("checkButton").addEventListener("click", ()=>{
            const numberInput = document.getElementById("numberInput").value;
            const resultElement = document.getElementById("result");

            if (numberInput === "") {
                resultElement.textContent = "Please enter a number.";
                return;
            }

            const num = parseInt(numberInput, 10);
            if (isNaN(num) || num < 1) {
                resultElement.textContent = "Please enter a valid positive integer.";
                return;
            }

            const isHappy = isHappyNumber(num);
            resultElement.textContent = isHappy ? `${num} is a happy number!` : `${num} is not a happy number.`;         
        });

        function isHappyNumber(num) {
            let seen = new Set();

            while (num !== 1 && !seen.has(num)) {
                seen.add(num);
                num = sumOfSquares(num);
            }

            return num === 1;
        }

        function sumOfSquares(num) {
            let sum = 0;
            while (num > 0) {
                let digit = num % 10;
                sum += digit * digit;
                num = Math.floor(num / 10);
            }
            return sum;
        }

        // example usage
        console.log(isHappyNumber(19)); // true
        console.log(isHappyNumber(2)); // false
    </script>

</body>

</html>
