<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Square Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: rgb(2, 84, 84);
            color: rgb(250, 240, 228);
            font-family: 'Courier New', Courier, monospace;
            margin-top: 12px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2;
        }

        .innerContainer {
            border: 2px solid rgb(250, 240, 228);
            border-radius: 10px;
            box-shadow: 0 0 12px;
            padding: 12px;
            margin: 12px;
            text-align: center;
        }

        .mainContainer .inputGroup label::after {
            content: "*";
            color: red;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Perfect Square Checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number...">
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="outputContainer">
                <h2>Result:</h2>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        function isPerfectSquare(num) {
            if (num < 0) return false; // Negative numbers cannot be perfect squares
            const sqrt = Math.sqrt(num);
            return sqrt === Math.floor(sqrt); // Check if the square root is an integer
        }


        // Example usage:
        console.log(isPerfectSquare(16)); // true
        console.log(isPerfectSquare(15)); // false
    </script>

</body>

</html>
