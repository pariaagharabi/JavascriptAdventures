<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Factorial of a Given Number</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            color: #080808;
            margin-top: 20px;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        .appContainer {
            display: flex;
        }

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Factorial of a Given Number</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number">
                </div>
                <button id="calculateBtn">Calculate Factorial</button>
            </main>

            <div class="output">
                <h1>
                    Result:
                </h1>
                <pre id="result"></pre>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("calculateBtn").addEventListener("click", () => {
            const userNumInput = document.getElementById("numberInput").value;
            const num = parseInt(userNumInput);

            document.getElementById("result").textContent = factorial(num);

        })

        function factorial(orgNum) {
            if (orgNum === 0 || orgNum === 1) {
                return 1;
            } else {
                return orgNum * factorial(orgNum - 1);
            }
        }

        // Example usage:
        console.log(factorial(5)); // Output: 120
    </script>

</body>

</html>
