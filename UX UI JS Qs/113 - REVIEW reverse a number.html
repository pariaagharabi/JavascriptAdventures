<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Reverse a number</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            color: coral;
            background-color: rgb(27, 26, 26);
            margin-top: 20px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 3rem;
        }

        .innerContainer {
            text-align: center;
            border: 2px solid coral;
            border-radius: 10px;
            box-shadow: 0 0 10px;
            padding: 20px;
        }

        .mainContainer .inputGroup label::after {
            content: "*";
            color: red;
        }

        .mainContainer .inputGroup input {
            background-color: transparent;
            color: coral;
            border: 2px solid coral;
            border-radius: 4px;
            padding: 2px;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Reverse a Number</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="e.g., 1234">
                </div>
                <button id="reverseButton">Reverse</button>
            </main>
        </div>
    </div>


    <script>
        function reverseNum(orgNum) {
            while (orgNum > 0) {
                return String(orgNum).split("").reverse().join("");
            }

            return orgNum;
        }

        // Test cases
        console.log(reverseNum(1234)); // Output: 4321
        console.log(reverseNum(1000)); // Output: 0001
    </script>

</body>

</html>
