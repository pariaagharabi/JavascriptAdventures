<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Palindrome Number Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color:rgb(27, 22, 17);
            color:burlywood;
            
        }

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Palindrome Number Checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number">
                </div>
                <button id="checkButton">Check Palindrome</button>
            </main>

            <div class="outputGroup">
                <h1 id="outputResult">Result:</h1>
                <p id="outputMessage"></p>
            </div>
        </div>
    </div>

    <script>
        function isPalindrome(num) {
            // Convert the number to a string
            const strNum = num.toString();
            // Reverse the string and compare with the original
            const reversedStrNum = strNum.split('').reverse().join('');
            return strNum === reversedStrNum;
        }

        // Example usage:
        console.log(isPalindrome(121)); // true
        console.log(isPalindrome(-121)); // false
    </script>

</body>

</html>
