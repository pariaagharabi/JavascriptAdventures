<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Sort an array</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: antiquewhite;
            color: rgb(47, 29, 4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 20px;
        }

    </style>
</head>

<body>
    <div class="appCotainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Sort an array</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="inputArray">Enter array elements (comma-separated):</label>
                    <input type="text" id="inputArray" name="array" placeholder="e.g., 7, 4, 1, 9, 0">
                </div>
                <button id="sortButton">Sort Array</button>
            </main>

            <div class="output">
                <h2>Sorted Array:</h2>
                <p id="sortedArray"></p>
            </div>
        </div>
    </div>

    <script>
        function sortArray(arr) {
            return arr.sort((a, b) => a - b);
        }

        // Example usage:
        console.log(sortArray([7, 4, 1, 9, 0])); // Output: [0, 1, 4, 7, 9]
    </script>

</body>

</html>
