<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Determine if a number is prime</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            color: rgb(70, 13, 124);
            background-color: rgb(255, 255, 255);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-top: 10px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.5;
        }

        .innerContainer {
            border: 1px solid rgb(70, 13, 124);
            border-radius: 10px;
            box-shadow: 0 0 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContianer">
                <h1>Determine if a Number is Prime</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" name="numberInput" placeholder="Enter a number" required>
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="output">
                <h1>Result:</h1>
                <pre id="result"></pre>
            </div>
        </div>
    </div>

    <script>
        function isPrime(number) {
            if (number <= 1) {
                return false;
            }

            for (let i = 2; i <= Math.sqrt(number); i++) {
                if (number % i === 0) return false;
            }

            return true;
        }

        // Example usage:
        console.log(isPrime(7)); // true
        console.log(isPrime(10)); // false

    </script>


</body>

</html>
