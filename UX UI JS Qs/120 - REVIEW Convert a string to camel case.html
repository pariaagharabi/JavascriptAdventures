<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Convert a string to camel case</title>

    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f4;
            color: rgb(2, 2, 58);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-top: 12px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.4;
        }

        .innerContainer {
            text-align: center;
            border: 1px solid rgb(2, 2, 58);
            border-radius: 8px;
            box-shadow: 0 0 12px;
            padding: 12px;
            margin: 8px;
        }

        .mainContainer .inputGroup label::after {
            content: " *";
            color: red;
        }

        .mainContainer .inputGroup input {
            color: rgb(2, 2, 58);
            background-color: transparent;
            border: 1.6px solid rgb(2, 2, 58);
            border-radius: 4px;
            padding: 2px;
            outline: none;
        }

        .mainContainer .inputGroup input:focus {
            border-color: rgb(2, 2, 58);
            box-shadow: 0 0 4px rgb(2, 2, 58);
        }

        .mainContainer button {
            color:rgb(2, 2, 58);
            background-color: transparent;
            border: 1.6px solid rgb(2, 2, 58);
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }
    </style>

</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Convert a string to camel case</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="inputString">Enter a string:</label>
                    <input type="text" id="inputString" placeholder="e.g., hello world">
                </div>
                <button id="convertButton">Convert to Camel Case</button>
            </main>

            <div class="outputContainer">
                <h2>Output:</h2>
                <p id="outputString"></p>
            </div>
        </div>
    </div>


    <script>
        function convertToCamelCase(orgStr) {
            let converedStrLower = orgStr.toLowerCase();
            let converedStrArr = converedStrLower.split(" ");

            // 1. Map through the array to capitalize subsequent words
            let camelCasedArr = converedStrArr.map((word, index) => {
                // If it's the first word, leave it lowercase
                if (index === 0) {
                    return word;
                }
                // For other words, capitalize the first character and attach the rest
                return word.charAt(0).toUpperCase() + word.slice(1);
            });

            // 2. Join the array back into a single string with no spaces
            return camelCasedArr.join("");
        }

        // Example usage:
        console.log(convertToCamelCase("hello world")); // Output: "helloWorld"

    </script>

</body>

</html>
