<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Greatest Common Divisor</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: rgb(252, 248, 246);
            color: rgb(1, 84, 84);
            font-family: quicksand, sans-serif;
            margin-top: 12px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.5;
        }

        .innerContainer {
            border: 1px solid rgb(1, 84, 84);
            border-radius: 10px;
            box-shadow: 0 0 12px;
            margin: 20px;
            padding: 12px;
            text-align: center;
        }

        .mainContainer :is(.inputGroup1, .inputGroup2) input {
            background-color: transparent;
            color: rgb(1, 84, 84);
            border: 2px solid rgb(1, 84, 84);
            border-radius: 4px;
            padding: 2px;
            outline: none;
        }

        .mainContainer :is(.inputGroup1, .inputGroup2) input:focus {
            border-color: rgb(1, 84, 84);
            box-shadow: 0 0 5px rgb(1, 84, 84);
        }

        .mainContainer button {
            color: rgb(1, 84, 84);
            background-color: transparent;
            border: 2px solid rgb(1, 84, 84);
            border-radius: 6px;
            padding: 2px 12px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            font-weight: bold;
        }

        .mainContainer button:hover {
            background-color: rgb(1, 84, 84);
            color: rgb(252, 248, 246);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">

            <header class="headerContainer">
                <h1>REVIEW - Greatest Common Divisor</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup1">
                    <label for="num1">Enter first number:</label>
                    <input type="number" id="num1" placeholder="Enter first number">
                </div>
                <div class="inputGroup2">
                    <label for="num2">Enter second number:</label>
                    <input type="number" id="num2" placeholder="Enter second number">
                </div>
                <button id="calculateBtn">Calculate GCD</button>
            </main>

            <div class="outputContainer">
                <h2>Result:</h2>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("calculateBtn").addEventListener("click", () => {
            const userInput1 = parseInt(document.getElementById("num1").value);
            const userInput2 = parseInt(document.getElementById("num2").value);

            if (isNaN(userInput1) || isNaN(userInput2)) {
                document.getElementById("result").textContent = "Please enter valid numbers.";
                return;
            };

            documet.getElementById("result").textContent
        })

        function calculateGCD(a, b) {
            while (b !== 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        // Example usage:
        console.log(calculateGCD(48, 18)); // Output: 6
    </script>
</body>

</html>
