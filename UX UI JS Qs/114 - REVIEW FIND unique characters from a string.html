<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - Find Unique Characters</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            color: rgb(22, 22, 21);
            background-color: beige;
            font-family: Arial, sans-serif;
            margin-top: 20px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.4rem;
        }

        .innerContainer {
            text-align: center;
            border: 2px solid rgb(22, 22, 21);
            border-radius: 10px;
            box-shadow: 0 0 10px;
            padding: 12px;
        }

        .mainContainer .inputGroup input {
            background-color: transparent;
            color: rgb(22, 22, 21);
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Find Unique Characters</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="inputString">Enter a string:</label>
                    <input type="text" id="inputString" placeholder="Type a string here...">
                </div>
                <button id="findUniqueBtn">Find Unique Characters</button>
            </main>

            <div class="outputContainer">
                <h2>Unique Characters:</h2>
                <p id="output"></p>
            </div>
        </div>
    </div>

    <script>
        function findUniqueCharacters(orgStr) {
            const freq = new Map();

            // Count frequencies
            for (const char of orgStr) {
                freq.set(char, (freq.get(char) || 0) + 1);
            }

            // Keep only characters that appear once, in original order
            return [...orgStr].filter(char => freq.get(char) === 1).join('');
        }

        // Example usage
        console.log(findUniqueCharacters("thequthe")); // Output: "qu"
    </script>

</body>

</html>
