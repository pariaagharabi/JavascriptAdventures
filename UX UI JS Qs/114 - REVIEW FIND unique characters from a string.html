<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - Find Unique Characters</title>
    <style></style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Find Unique Characters</h1>
            </header>
        </div>
    </div>

    <script>
        function findUniqueCharacters(orgStr) {
            const freq = new Map();

            // Count frequencies
            for (const char of orgStr) {
                freq.set(char, (freq.get(char) || 0) + 1);
            }

            // Keep only characters that appear once, in original order
            return [...orgStr].filter(char => freq.get(char) === 1).join('');
        }

        // Example usage
        console.log(findUniqueCharacters("thequthe")); // Output: "qu"
    </script>

</body>

</html>
