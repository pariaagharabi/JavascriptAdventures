<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f4;
            color: rgb(39, 36, 36);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-top: 12px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.8;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Armstrong Number Checker</h1>
            </header>


            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number..." required>
                </div>
                <button id="checkButton">Check Armstrong Number</button>
            </main>

            <div class="outputContainer">
                <h1>Result:</h1>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("checkButton").addEventListener("click", () => {
            const numberInput = document.getElementById("numberInput").value;
            const resultElement = document.getElementById("result");

            if (numberInput === "") {
                resultElement.textContent = "Please enter a number.";
                return;
            }

            const number = parseInt(numberInput);
            if (isNaN(number)) {
                resultElement.textContent = "Invalid input. Please enter a valid number.";
                return;
            }

            const isArmstrong = isArmstrongNumber(number);
            if (isArmstrong) {
                resultElement.textContent = `${number} is an Armstrong number.`;
            } else {
                resultElement.textContent = `${number} is not an Armstrong number.`;
            }
        });

        function isArmstrongNumber(num) {
            const digits = num.toString().split('');
            const numDigits = digits.length;
            const sumOfPowers = digits.reduce((sum, digit) => sum + Math.pow(parseInt(digit), numDigits), 0);
            return sumOfPowers === num;
        }

        // Example usage:
        console.log(isArmstrongNumber(153)); // true

    </script>

</body>

</html>
