<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number Checker</title>
    <style>

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <h1>Armstrong Number Checker</h1>
        </div>

        <main class="mainContainer">
            <div class="inputGroup">
                <label for="numberInput">Number:</label>
                <input type="number" id="numberInput" placeholder="Enter a number..." required>
            </div>
            <button id="checkButton">Check Armstrong Number</button>
        </main>

        <div class="outputContainer">
            <h1>Result:</h1>
            <p id="result"></p>
        </div>
    </div>

    <script>
        document.getElementById("checkButton").addEventListener("click",)

        function isArmstrongNumber(num) {
            const digits = num.toString().split('');
            const numDigits = digits.length;
            const sumOfPowers = digits.reduce((sum, digit) => sum + Math.pow(parseInt(digit), numDigits), 0);
            return sumOfPowers === num;
        }

        // Example usage:
        console.log(isArmstrongNumber(153)); // true

    </script>

</body>

</html>
