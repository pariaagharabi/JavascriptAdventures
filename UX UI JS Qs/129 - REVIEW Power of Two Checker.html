<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Power of Two Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(245, 251, 251);
            color: rgb(30, 69, 69);
            font-family: 'Courier New', Courier, monospace;
            margin-top: 20px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.6;
        }

        .innerContainer {
            border: 1px solid rgb(30, 69, 69);
            border-radius: 12px;
            box-shadow: 0 0 12px rgb(30, 69, 69);
            text-align: center;
            padding: 20px;
            margin: 8px;
        }

        .mainContainer .inputGroup label::after {
            content: "*";
        }
    </style>

</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Power of two checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="">Number: </label>
                    <input type="text" id="inputNum" aria-placeholder="Enter a number...">
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="outputContainer">
                <h1>Result:</h1>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("checkButton").addEventListener("click", () => {
            const userInput = parseInt(document.getElementById("inputNum").value);

            if (isNaN(userInput)) {
                document.getElementById("result").textContent = "Please enter a valid number.";
                return;
            }

            document.getElementById("result").textContent = `${userInput} is ${isPowerOfTwo(userInput) ? '' : 'not '}a power of two.`;
        })

        function isPowerOfTwo(orgNum) {
            if (orgNum <= 0) {
                return false;
            }
            return (orgNum & (orgNum - 1)) === 0;
        }

        // Example usage:
        console.log(isPowerOfTwo(13)); // false
        console.log(isPowerOfTwo(2)); // true

    </script>

</body>

</html>
