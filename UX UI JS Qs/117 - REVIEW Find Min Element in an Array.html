<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Find minimum element in an array</title>
    <style>

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <div class="header headerContainer">
                <h1>Find Minimum Element in an Array</h1>
            </div>

            <div class="main mainContainer">
                <div class="inputGroup">
                    <label for="arrayInput">Enter array elements (comma separated):</label>
                    <input type="text" id="arrayInput" placeholder="e.g. 3, 1, 4, 1, 5, 9">
                </div>
                <button id="findMinButton">Find Minimum</button>
            </div>

            <div class="outputContainer">
                <h1>Minimum Value: <span id="minValue"></span></h1>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("findMinButton").addEventListener("click", ()=>{
            const userInput = document.getElementById("arrayInput").value;
            const array = userInput.split(',').map(Number);
        })

        function findMinElement(arr) {
            if (arr.length === 0) {
                return null; // Return null for empty array
            }
            let min = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] < min) {
                    min = arr[i];
                }
            }
            return min;
        }

        // Example usage:
        console.log(findMinElement([3, 1, 4, 1, 5, 9]));

    </script>

</body>

</html>
