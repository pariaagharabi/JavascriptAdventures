<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Find minimum element in an array</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            color: rgb(22, 243, 22);
            background-color: rgb(0, 4, 0);
            font-family: cursive;
            margin-top: 20px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 1.8;

        }

        .innerContainer {
            text-align: center;
            border: 1px solid rgb(22, 243, 22);
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(22, 243, 22);
            padding: 20px;
            margin: 12px;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <div class="header headerContainer">
                <h1>Find Minimum Element in an Array</h1>
            </div>

            <div class="main mainContainer">
                <div class="inputGroup">
                    <label for="arrayInput">Enter array elements (comma separated):</label>
                    <input type="text" id="arrayInput" placeholder="e.g. 3, 1, 4, 1, 5, 9">
                </div>
                <button id="findMinButton">Find Minimum</button>
            </div>

            <div class="outputContainer">
                <h1>Minimum Value: <span id="minValue"></span></h1>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("findMinButton").addEventListener("click", () => {
            const userInput = document.getElementById("arrayInput").value;
            const array = userInput.split(',').map(Number);
            const minValue = findMinElement(array);
            document.getElementById("minValue").textContent = minValue;
        })

        function findMinElement(arr) {
            if (arr.length === 0) {
                return null; // Return null for empty array
            }
            let min = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] < min) {
                    min = arr[i];
                }
            }
            return min;
        }

        // Example usage:
        console.log(findMinElement([3, 1, 4, 1, 5, 9]));

    </script>

</body>

</html>
