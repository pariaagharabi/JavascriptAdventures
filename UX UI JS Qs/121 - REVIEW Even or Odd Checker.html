<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Even or Odd Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(22, 16, 17);
            color:pink;
            
        }

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Even or Odd Checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number">
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="output">
                <h1 id="outputTitle">Result:</h1>
                <p id="outputText"></p>
            </div>
        </div>
    </div>


    <script>
        document.getElementById("checkButton").addEventListener("click", ()=>{
            const numberInput = document.getElementById("numberInput").value;
            const result = checkEvenOdd(parseInt(numberInput));
            document.getElementById("outputText").textContent = result;
        });

        function checkEvenOdd(orgNum) {
            if (orgNum % 2 === 0) {
                return orgNum + " is even.";
            } else {
                return orgNum + " is odd.";
            }
        }

        // Example usage:
        console.log(checkEvenOdd(4)); // Output: 4 is even.
        console.log(checkEvenOdd(7)); // Output: 7 is odd.
    </script>

</body>

</html>
