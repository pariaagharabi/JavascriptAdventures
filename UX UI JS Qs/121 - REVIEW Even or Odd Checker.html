<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Even or Odd Checker</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(11, 10, 11);
            color:rgb(249, 121, 142);
            font-family:cursive;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.6;
        }

        .innerContainer {
            border: 1px solid rgb(249, 121, 142);
            border-radius: 8px;
            box-shadow: 0 0 12px;
            padding: 12px;
            margin: 8px;
            text-align: center;
        }

        .mainContainer .inputGroup label::after {
            content: " *";
            color: red;
        }

        .mainContainer .inputGroup input {
            color: rgb(249, 121, 142);
            background-color: transparent;
            outline: none;
            border: 1.6px solid rgb(249, 121, 142);
            border-radius: 4px;
            padding: 2px;
        }

        .mainContainer .inputGroup input:focus {
            border-color: rgb(249, 121, 142);
            box-shadow: 0 0 4px rgb(249, 121, 142);
        }

        .mainContainer button {
            color:rgb(249, 121, 142);
            background-color: transparent;
        }

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Even or Odd Checker</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number">
                </div>
                <button id="checkButton">Check</button>
            </main>

            <div class="output">
                <h1 id="outputTitle">Result:</h1>
                <p id="outputText"></p>
            </div>
        </div>
    </div>


    <script>
        document.getElementById("checkButton").addEventListener("click", ()=>{
            const numberInput = document.getElementById("numberInput").value;
            const result = checkEvenOdd(parseInt(numberInput));
            document.getElementById("outputText").textContent = result;
        });

        function checkEvenOdd(orgNum) {
            if (orgNum % 2 === 0) {
                return orgNum + " is even.";
            } else {
                return orgNum + " is odd.";
            }
        }

        // Example usage:
        console.log(checkEvenOdd(4)); // Output: 4 is even.
        console.log(checkEvenOdd(7)); // Output: 7 is odd.
    </script>

</body>

</html>
