<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Factorial Calculator</title>
    <style>

    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Factorial Calculator</h1>
            </header>
        </div>
    </div>

    <script>
        function factorialCalc(orgNum) {
            if (orgNum < 0) {
                return "Factorial is not defined for negative numbers.";
            }

            let fact = 1;
            for (let i = 1; i <= orgNum; i++) {
                fact *= i;
            }
            return fact;
        }

        // Example usage:
        console.log(factorialCalc(5)); // Output: 120
        console.log(factorialCalc(-3)); // Output: 1
    </script>

</body>

</html>
