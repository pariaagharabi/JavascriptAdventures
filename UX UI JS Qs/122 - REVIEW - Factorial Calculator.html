<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVIEW - Factorial Calculator</title>
    <style>
        :is(*, *::before, *::after) {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(13, 13, 13);
            color: rgb(255, 85, 0);
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            margin-top:12px;
        }

        .appContainer {
            display: flex;
            justify-content: center;
            line-height: 2.6;
        }

        .innerContainer {
            border: 1px solid rgb(255, 85, 0);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px;
            margin: 10px;
            text-align: center;
        }

        .mainContainer .inputGroup label::after {
            content: " *";
            color: red;
        }

        .mainContainer .inputGroup input {
            color: rgb(255, 85, 0);
            background-color: transparent;
            outline: none;
            border: 1.6px solid rgb(255, 85, 0);
            border-radius: 4px;
            padding: 2px;
        }

        .mainContainer .inputGroup input:focus {
            border-color: rgb(255, 85, 0);
            box-shadow: 0 0 4px rgb(255, 85, 0);
        }

        .mainContainer button {
            color: rgb(255, 85, 0);
            background-color: transparent;
            border: 1.6px solid rgb(255, 85, 0);
            border-radius: 4px;
            padding: 2px 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="appContainer">
        <div class="innerContainer">
            <header class="headerContainer">
                <h1>Factorial Calculator</h1>
            </header>

            <main class="mainContainer">
                <div class="inputGroup">
                    <label for="numberInput">Enter a number:</label>
                    <input type="number" id="numberInput" placeholder="Enter a number">
                </div>
                <button id="calculateBtn">Calculate Factorial</button>
            </main>

            <div class="outputContainer">
                <h2>Result:</h2>
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("calculateBtn").addEventListener("click", () => {
            const numberInput = document.getElementById("numberInput").value;
            const result = factorialCalc(parseInt(numberInput));
            document.getElementById("result").textContent = result;
        })

        function factorialCalc(orgNum) {
            if (orgNum < 0) {
                return "Factorial is not defined for negative numbers.";
            }

            let fact = 1;
            for (let i = 1; i <= orgNum; i++) {
                fact *= i;
            }
            return fact;
        }

        // Example usage:
        console.log(factorialCalc(5)); // Output: 120
        console.log(factorialCalc(-3)); // Output: 1
    </script>

</body>

</html>
